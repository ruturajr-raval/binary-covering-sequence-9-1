name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-solver.txt
      - run: make test
      - run: make solver-test
      - run: make verify-baseline
      - run: make analyze-backbone analyze-exact-overlap
      - run: make search-smoke breakout-smoke ejection-smoke
